name: nexpush
description: Instant push notifications for Flutter — FCM, local notifications, Laravel backend. No VPS needed. Powered by NexDeve.
version: 1.0.0
homepage: https://github.com/nexdeve/nexpush

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

flutter:
  plugin:
    platforms:
      android:
        package: ai.nextech.nexpush
        pluginClass: NexPushPlugin
      ios:
        pluginClass: NexPushPlugin

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
